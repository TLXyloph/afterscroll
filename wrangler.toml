name = "afterscroll"
main = ".open-next/worker.js"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

# Static assets emitted by the OpenNext Cloudflare adapter
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# D1 database — create it with:
#   npx wrangler d1 create afterscroll
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "afterscroll"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[vars]
CF_D1 = "1"
APP_URL = "https://afterscroll.<your-subdomain>.workers.dev"
BILLING_ENFORCED = "false"
SPEND_CAP_USD_PER_DAY = "2.00"
GLOBAL_SPEND_CAP_USD_PER_DAY = "100.00"

# Secrets are NOT stored here — set each with `wrangler secret put <NAME>`:
#   X_CLIENT_ID X_CLIENT_SECRET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET
#   AZURE_ANTHROPIC_API_KEY AZURE_ANTHROPIC_RESOURCE
#   STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET ADMIN_KEY
